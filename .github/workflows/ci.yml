name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # HTTP is mocked via pytest-httpx and every secret is read with
      # required=False in the paths tests exercise, so no `pass` store or API
      # keys are needed here. If a future test needs a token, inject it as the
      # TVL_SCANNER_<NAME> env-var fallback (see config.get_secret).
      - name: Lint
        run: ruff check src/ tests/

      - name: Typecheck
        run: mypy src/

      - name: Test
        run: pytest -q
