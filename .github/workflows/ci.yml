name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # HTTP is mocked via pytest-httpx and every secret is read with
      # required=False in the paths tests exercise, so no `pass` store or API
      # keys are needed here. If a future test needs a token, inject it as the
      # TVL_SCANNER_<NAME> env-var fallback (see config.get_secret).
      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type check (mypy strict)
        run: python -m mypy src/

      - name: Tests
        run: python -m pytest -q
