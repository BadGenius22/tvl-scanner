# Daily job scan: discover → score → report, committed back to the repo.
#
# NOTE: GitHub only runs `schedule` workflows from the DEFAULT branch of the
# repository this file lives in — the cron activates once job-scanner lives in
# its own repo (or this file is at the root .github/workflows of a repo).
# `workflow_dispatch` allows manual runs from the Actions tab any time.
name: daily-job-scan

on:
  schedule:
    # 22:00 UTC = 05:00 WIB — the report is ready with morning coffee.
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e .

      - name: Run scan
        run: python -m job_scanner run --log-level INFO

      - name: Commit report + state
        run: |
          git config user.name "job-scanner[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ artifacts/job_scan_state.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "job-scan: $(date -u +%F) daily report"
            git push
          fi
