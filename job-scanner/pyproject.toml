[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-scanner"
version = "0.1.0"
description = "Daily open-role scanner ranked by personal suitability (skills, salary, location, benefits)"
requires-python = ">=3.11"
authors = [{name = "Dewangga Praxindo", email = "dewa.xindo@gmail.com"}]
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.3",
    "mypy>=1.9",
    "types-pyyaml",
]

[project.scripts]
job-scanner = "job_scanner.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
job_scanner = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # line length — long report strings and API-response comments
    # Report output intentionally uses "…", "→", "•" etc.
    "RUF001", "RUF002", "RUF003",
    # `class X(str, Enum)` is intentional: StrEnum changes f-string rendering.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SIM117"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
