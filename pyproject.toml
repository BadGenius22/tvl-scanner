[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tvl-scanner"
version = "0.5.3"
description = "TVL-weighted attack surface scanner for under-audited smart contract protocols"
requires-python = ">=3.11"
authors = [{name = "Dewangga Praxindo", email = "dewa.xindo@gmail.com"}]
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "ruff>=0.3",
    "mypy>=1.9",
    "types-pyyaml",
]

[project.scripts]
tvl-scanner = "tvl_scanner.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tvl_scanner = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # line length — long API-response comments and report strings
    # Ambiguous-unicode lints. Report output and many comments intentionally use
    # "…", "→", "×", "≥", curly quotes etc.; rewriting them to ASCII would change
    # report text. Cosmetic, not correctness, so silence them.
    "RUF001", # ambiguous character in a string
    "RUF002", # ambiguous character in a docstring
    "RUF003", # ambiguous character in a comment
    # `class X(str, Enum)` → `StrEnum`. StrEnum changes str()/f-string rendering
    # of members (f"{Chain.SOLANA}" -> "solana" instead of "Chain.SOLANA"), which
    # could silently alter report/log output. The (str, Enum) pattern is intentional.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Test mock setups nest multiple `with patch(...)` context managers; the nested
# form is the idiomatic, readable pytest pattern and combining them produces
# unwieldy lines. Keep SIM117 active for src/ where it's meaningful.
"tests/**" = ["SIM117"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
