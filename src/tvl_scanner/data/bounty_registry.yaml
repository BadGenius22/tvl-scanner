# Curated bounty program registry.
#
# Each entry is a known public bug bounty program. The scanner uses this as
# the seeds list — a candidate is tagged with bounty_program=<platform> if its
# display_name or defillama_slug matches any of the `slugs` entries (case-
# insensitive, exact match).
#
# Add new entries as you discover them — it's a text file, commit freely.
#
# Fields:
#   name          — canonical protocol name (human readable)
#   slugs         — list of match keys (lowercase slugs, protocol names, aliases)
#   platform      — immunefi | hackerone | hackenproof | cantina | selfhosted
#   url           — direct URL to the bounty listing
#   max_payout_usd — maximum single finding payout (USD). null if unspecified.

- name: Aave
  slugs: [aave, aave-v2, aave-v3, aave-v4]
  platform: immunefi
  url: https://immunefi.com/bounty/aave/
  max_payout_usd: 1000000

