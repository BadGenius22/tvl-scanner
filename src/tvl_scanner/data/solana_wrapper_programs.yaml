# Known Solana wrapper / framework programs.
#
# When a candidate's primary contract account is owned by one of these
# programs, the protocol is a thin DEPLOYMENT of the program rather than
# custom code. The audit history of the upstream program is what actually
# secures the candidate's TVL — there's no novel attack surface to find.
#
# Used by enrich/solana_wrapper_check.py. Match is by exact program_id
# string against the `owner` field returned by `getAccountInfo`.
#
# Fields:
#   program_id     — base58 Solana program address
#   name           — human-readable upstream program name
#   audit_count    — number of independent audits the upstream program has
#   audit_url      — public link to the upstream audit history
#   description    — one-sentence context for the report

- program_id: SPoo1Ku8WFXoNDMHPsrGSTSG1Y47rzgn41SLUNakuHy
  name: SPL Stake Pool
  audit_count: 3
  audit_url: https://spl.solana.com/stake-pool#security-audits
  description: Solana Foundation native stake pool program. Used by JPool, JagPool, BlazeStake, Cogent, Edgevana, Lido on Solana, and many others.

