# Curated GitHub repository registry.
#
# DefiLlama's /protocols catalog and /protocol/{slug} detail endpoint don't
# reliably expose github URLs — even for well-known protocols with obvious
# public repos. This seed file fills that gap: when both DefiLlama paths
# return nothing for a given slug, the scanner falls back to this registry.
#
# A match here unlocks:
#   - LOC estimate (via GitHub /languages endpoint)
#   - `audits/` folder check (via GitHub /contents endpoint)
#   - Language detection beyond the chain-default heuristic
#
# Entries are matched by exact slug (lowercase, after strip). Add new entries
# freely — this is a flat text file, committed in git.

