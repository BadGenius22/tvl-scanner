# NOTE ON THE TRIGGER: unlike every target above, these two are NOT waiting on a
# fresh commit delta — the delta is already large and unaudited. They are waiting
# on MAINNET DEPLOYMENT. 1inch's own rewards body states "As Aqua is not yet
# deployed on mainnet with actual user funds, all severity levels have a base
# reward amount" (Critical base $20k, up to $100k at 1inch's sole discretion) and
# "Once Aqua is deployed to mainnet with live user funds, this section will be
# reviewed and updated to reflect production reward amounts." So the real tripwire
# is: watch for a mainnet deploy, THEN re-read the program's reward terms. Commit
# churn here is a proxy signal (deploy scripts / broadcast/ landing), not the gate.
