# Delta-watch target list.
#
# Each entry is a protocol whose git repo the scanner tracks for NEW commits to
# fund-exit paths (withdraw/redeem/borrow/liquidate/collateral/mint/flashloan/...)
# since its last audit. The single best attack surface is fresh, unaudited code
# on permissionless paths in an actively-developed protocol — `tvl-scanner
# delta-watch` surfaces exactly that.
#
# Fields:
#   slug              (required) canonical protocol id; the per-target record filename
#   display_name      (required) human name for the report
#   github            (required) repo URL to watch
#   chains            (optional) list of chains, e.g. [solana] or [ethereum, base]
#   languages         (optional) [rust] | [solidity] | [move]
#   branch            (optional) watch this ref instead of the repo's default branch.
#                     Needed for protocols that develop on a release/version branch
#                     (e.g. marginfi's `0.1.9-main`) while `main` stays frozen at an
#                     old release — without this the watcher would see zero delta.
#   audited_at_commit (optional) the commit the protocol was last reviewed at. When
#                     set, every run diffs from THIS ref so the report always shows
#                     the full unaudited surface. When absent, the watcher diffs
#                     from the last commit it checked (incremental, persisted in
#                     artifacts/delta_watch_state.json).
#   audited_at_date   (optional) ISO date of that audit, for the report
#   bounty_program    (optional) immunefi | cantina | hackerone | hackenproof | selfhosted | none
#   bounty_max_payout_usd (optional) integer USD, drives payout context in the report
#   extra_keywords    (optional) list of extra fund-path keywords for THIS target
#                     only, merged with the global Settings.FUND_PATH_KEYWORDS.
#                     For protocols whose fund logic is named with domain terms
#                     the generic list misses (tranche/yield: strateg/accounting/
#                     cdo/cooldown/redemption). Keeps the noise off other targets.
#
# Seeded from the protocols reviewed in the 2026-06 audit session. Extend freely.

- slug: omnipair
  display_name: Omnipair
  github: https://github.com/omnipair/omnipair-rs
  chains: [solana]
  languages: [rust]
  audited_at_commit: a927600
  audited_at_date: 2026-04-07
  bounty_program: none

- slug: project-0
  display_name: Project 0 (marginfi-v2)
  github: https://github.com/0dotxyz/marginfi-v2
  chains: [solana]
  languages: [rust]
  # marginfi develops on version branches; `main` is frozen. Watch the active
  # release line for the real post-audit fund-path delta.
  # Baseline re-pinned to OUR last review: 843aa82d delta audited 2026-05-28
  # (NOTHING_SUBMITTABLE); the #578/#591/#594 delta through f62a46be audited
  # 2026-06-06 (NOTHING_SUBMITTABLE — net-hardening audit-fixes). So future
  # runs surface only commits AFTER f62a46be, not the already-cleared surface.
  branch: 0.1.9-main
  audited_at_commit: f62a46be
  audited_at_date: 2026-06-06
  bounty_program: immunefi
  bounty_max_payout_usd: 500000

- slug: strata-markets
  display_name: Strata Markets
  github: https://github.com/Strata-Markets/contracts
  chains: [ethereum]
  languages: [solidity]
  # Risk-tranching yield protocol (senior/junior ERC-4626 over Ethena/Midas/
  # Saturn/Figure). Core fund logic lives under contracts/tranches/ (StrataCDO,
  # DYSAccounting, Tranche, per-strategy adapters). Develops on the `tranches`
  # branch (the repo default). Baseline pinned to the last audited commit:
  # tranches @ 1021020a (2026-01-22, immediately before Cyfrin's 2026-01-23
  # shares-cooldown review). HEAD is ~95 commits / 112 fund-path files ahead —
  # the entirely unaudited Apr-Jun 2026 strategy adapters (figure/ethena/midas/
  # saturn) + DYS accounting changes are the target surface. No bug bounty/
  # contest = uncontested delta.
  branch: tranches
  audited_at_commit: 1021020ab866
  audited_at_date: 2026-01-23
  bounty_program: none
  # Strata's core fund logic (StrataCDO / DYSAccounting / Tranche / per-strategy
  # adapters / cooldown) uses domain names the generic keyword list misses.
  extra_keywords: [cdo, accounting, strateg, cooldown, redemption]

- slug: veda
  display_name: Veda (boring-vault)
  github: https://github.com/Veda-Labs/boring-vault
  chains: [ethereum]
  languages: [solidity]
  # DeFi vault primitive — BoringVault + Teller (deposit/withdraw entry),
  # Accountant (share pricing), Manager-with-merkle (strategy execution).
  # Immunefi $1M, listed ~2026-01. The repo has NO audits/ folder and no release
  # tags, so this baseline is a PROVISIONAL date proxy: main @ 44e17b06 (PR #629,
  # 2026-03-28) = the trailing ~3 months of fund-path commits. RE-PIN to Veda's
  # true last-audit commit once identified (Veda publishes Spearbit/Cantina
  # reports off-repo). HEAD was 480c683d (2026-06-26) when added; main is
  # actively developed (~116 PRs in the window) so expect a large delta.
  branch: main
  audited_at_commit: 44e17b06
  audited_at_date: 2026-03-28
  bounty_program: immunefi
  bounty_max_payout_usd: 1000000
  # Veda's fund-path components are named with domain terms the generic list
  # misses: Teller, Accountant, Manager, BoringVault.
  extra_keywords: [teller, accountant, manager, boring]

- slug: spark-alm
  display_name: Spark (ALM Controller)
  github: https://github.com/sparkdotfi/spark-alm-controller
  chains: [ethereum]
  languages: [solidity]
  # Spark's Asset-Liability-Mgmt controller — moves protocol funds across
  # PSM/Aave/Morpho/exchanges via rate-limited actions (MainnetController,
  # ForeignController, ALMProxy, RateLimitHelpers). Part of the Spark/sparklend
  # Immunefi $5M program. Active branch is `dev` (default); `master` lags.
  # Baseline pinned to the LAST AUDITED RELEASE v1.10.0 = 984ec546 (Cantina +
  # Certora v1100 reports in audits/, tag dated 2026-02-16). NOTE: at add time
  # dev was only +2 commits over v1.10.0 (deploy-only, 5 files) — the ALM delta
  # is currently small/quiet, not a fresh-surface goldmine. Sibling in-scope
  # repos (sparklend core, xchain-ssr-oracle, spark-gov-relay) can be added as
  # separate entries if a broader Spark sweep is wanted.
  branch: dev
  audited_at_commit: 984ec546
  audited_at_date: 2026-02-16
  bounty_program: immunefi
  bounty_max_payout_usd: 5000000
  # ALM fund-movement files use domain names the generic list misses:
  # MainnetController/ForeignController, ALMProxy, RateLimitHelpers, PSM.
  extra_keywords: [controller, ratelimit, psm, alm]
