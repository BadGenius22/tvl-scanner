# Why they're worth watching at all: this is the only genuinely un-picked-over
# 1inch surface. The sibling $500k "1inch - Smart Contracts" program gated out on
# 2026-07-17 (all 8 assets carry 8-15 published audits; the entire post-audit
# delta is deploy automation + dep bumps, and the Solana repos' newest logic
# commits are literally the `audit/*` fix branches). Aqua/Swap VM have NO entry in
# github.com/1inch/1inch-audits and are novel: an opcode-dispatch swap VM with
# transient storage, MakerTraits/TakerTraits, PeggedSwapMath, XYCConcentrate.
#
# Program: https://immunefi.com/bug-bounty/1inch-aqua/information/ (KYC required,
# Primacy of RULES — scope is file-enumerated, not repo-wide; see per-entry notes).

